<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add New Pond - Smart AquaFarm</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef7f8;
            min-height: 100vh;
        }

        /* ==============================
           HEADER
        ============================== */

        header {
            background: linear-gradient(
                135deg,
                #00695c,
                #00897b
            );

            color: white;

            padding: 20px 40px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
        }

        .header-buttons {
            display: flex;
            gap: 12px;
        }

        .header-buttons a {
            text-decoration: none;
            color: white;
            background: rgba(255,255,255,0.15);
            padding: 10px 18px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .header-buttons a:hover {
            background: rgba(255,255,255,0.30);
        }

        /* ==============================
           MAIN CONTAINER
        ============================== */

        .container {
            width: 90%;
            max-width: 700px;
            margin: 50px auto;
        }

        /* ==============================
           FORM CARD
        ============================== */

        .form-card {
            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow: 0 8px 25px rgba(0,0,0,0.10);
        }

        .form-card h1 {
            color: #00695c;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        /* ==============================
           FORM GROUP
        ============================== */

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;

            font-weight: bold;

            margin-bottom: 8px;

            color: #333;
        }

        .form-group input,
        .form-group select {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #ccc;

            border-radius: 9px;

            font-size: 15px;

            outline: none;

            transition: 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #00897b;

            box-shadow:
                0 0 0 3px rgba(0,137,123,0.10);
        }

        /* ==============================
           SPECIES SECTION
        ============================== */

        .species-title {
            color: #00695c;
            margin-top: 5px;
            margin-bottom: 8px;
        }

        .species-note {
            font-size: 13px;
            color: #777;
            margin-bottom: 10px;
        }

        /* ==============================
           BUTTONS
        ============================== */

        .buttons {
            display: flex;

            gap: 15px;

            margin-top: 30px;
        }

        .btn {
            flex: 1;

            padding: 14px;

            border: none;

            border-radius: 9px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            text-align: center;

            text-decoration: none;

            transition: 0.3s;
        }

        .btn-save {
            background: #00897b;
            color: white;
        }

        .btn-save:hover {
            background: #00695c;
        }

        .btn-cancel {
            background: #e0e0e0;
            color: #333;
        }

        .btn-cancel:hover {
            background: #cccccc;
        }

        /* ==============================
           SPECIES PREVIEW
        ============================== */

        .species-preview {
            margin-top: 20px;

            display: none;

            text-align: center;

            padding: 15px;

            background: #f3fbfa;

            border-radius: 12px;

            border: 1px solid #d4eeee;
        }

        .species-preview img {
            width: 180px;

            height: 120px;

            object-fit: cover;

            border-radius: 10px;

            margin-top: 10px;
        }

        .species-preview p {
            margin-top: 8px;

            font-weight: bold;

            color: #00695c;
        }

        /* ==============================
           RESPONSIVE
        ============================== */

        @media (max-width: 600px) {

            header {
                padding: 18px 20px;
            }

            .logo {
                font-size: 20px;
            }

            .header-buttons a {
                padding: 8px 10px;
                font-size: 13px;
            }

            .container {
                width: 94%;
                margin: 25px auto;
            }

            .form-card {
                padding: 25px 20px;
            }

            .buttons {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header>

    <div class="logo">
        🐟 Smart AquaFarm
    </div>

    <div class="header-buttons">

        <a href="/dashboard">
            Dashboard
        </a>

        <a href="/ponds">
            My Ponds
        </a>

        <a href="/logout">
            Logout
        </a>

    </div>

</header>


<!-- =========================================
     MAIN
========================================= -->

<div class="container">


    <div class="form-card">


        <h1>
            Add New Pond
        </h1>

        <p class="subtitle">
            Enter the details of your aquaculture pond
        </p>


        <!-- =====================================
             FORM
        ====================================== -->

        <form
            action="/savepond"
            method="POST"
        >


            <!-- POND NAME -->

            <div class="form-group">

                <label for="pond_name">
                    Pond Name
                </label>

                <input
                    type="text"
                    id="pond_name"
                    name="pond_name"
                    placeholder="Example: Pond 1"
                    required
                >

            </div>


            <!-- SPECIES -->

            <div class="form-group">

                <label
                    for="species"
                    class="species-title"
                >
                    Species
                </label>

                <p class="species-note">
                    Select one of the supported fish or prawn species.
                </p>

                <select
                    id="species"
                    name="species"
                    required
                    onchange="showSpeciesPreview()"
                >

                    <option value="">
                        -- Select Species --
                    </option>


                    <!-- FISH -->

                    <optgroup label="Fish">

                        <option value="Koramenu">
                            Koramenu
                        </option>

                        <option value="Rupchandha">
                            Rupchandha
                        </option>

                        <option value="Pangas">
                            Pangas
                        </option>

                        <option value="Silavati">
                            Silavati
                        </option>

                        <option value="Catla">
                            Catla
                        </option>

                        <option value="Catfish">
                            Catfish
                        </option>

                    </optgroup>


                    <!-- PRAWNS -->

                    <optgroup label="Prawns">

                        <option value="Tiger">
                            Tiger
                        </option>

                        <option value="King">
                            King
                        </option>

                        <option value="Vannamei">
                            Vannamei
                        </option>

                        <option value="Kala">
                            Kala
                        </option>

                    </optgroup>

                </select>

            </div>


            <!-- SPECIES IMAGE PREVIEW -->

            <div
                id="speciesPreview"
                class="species-preview"
            >

                <div>
                    Selected Species
                </div>

                <img
                    id="speciesImage"
                    src=""
                    alt="Species Preview"
                >

                <p id="speciesName"></p>

            </div>


            <!-- AREA -->

            <div class="form-group">

                <label for="area">
                    Pond Area (sq.m)
                </label>

                <input
                    type="number"
                    id="area"
                    name="area"
                    placeholder="Example: 500"
                    min="0"
                    step="0.01"
                    required
                >

            </div>


            <!-- FISH COUNT -->

            <div class="form-group">

                <label for="fish_count">
                    Fish / Prawn Count
                </label>

                <input
                    type="number"
                    id="fish_count"
                    name="fish_count"
                    placeholder="Example: 1000"
                    min="0"
                    required
                >

            </div>


            <!-- BUTTONS -->

            <div class="buttons">

                <a
                    href="/ponds"
                    class="btn btn-cancel"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="btn btn-save"
                >
                    Add Pond
                </button>

            </div>


        </form>

    </div>

</div>


<!-- =========================================
     JAVASCRIPT
========================================= -->

<script>

    function showSpeciesPreview() {

        const species =
            document.getElementById("species").value;

        const preview =
            document.getElementById("speciesPreview");

        const image =
            document.getElementById("speciesImage");

        const name =
            document.getElementById("speciesName");


        if (!species) {

            preview.style.display = "none";

            image.src = "";

            name.textContent = "";

            return;
        }


        /*
         * Convert species name to lowercase.
         * This matches the filenames inside:
         *
         * static/species_images/
         */

        const imageMap = {

            "Koramenu": "koramenu.jpg",

            "Rupchandha": "rupchandha.jpg",

            "Pangas": "pangas.jpg",

            "Silavati": "silavati.jpg",

            "Catla": "catla.jpg",

            "Catfish": "catfish.jpg",

            "Tiger": "tiger.jpg",

            "King": "king.jpg",

            "Vannamei": "vannamei.jpg",

            "Kala": "kala.jpg"

        };


        const imageName =
            imageMap[species] || "default.jpg";


        image.src =
            "/static/species_images/" + imageName;


        image.alt =
            species;


        name.textContent =
            species;


        preview.style.display =
            "block";

    }

</script>


</body>

</html>
